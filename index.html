        // ==========================================
        // 2. 智慧解析器
        // ==========================================
        function parseBank(text, bankId) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
            const questions = [];
            let currentQ = null;
            let answerMap = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                if (/^\d+\)$/.test(line) && lines[i + 1] && /^[A-D]$/.test(lines[i + 1])) {
                    answerMap[line.replace(')', '')] = lines[i + 1];
                    i++;
                    continue;
                }

                if (/^\d+\)$/.test(line) && lines[i + 1] && /^_{3,}$/.test(lines[i + 1])) {
                    i++;
                    continue;
                }

                if (/^\d+\)$/.test(line)) {
                    if (currentQ && currentQ.text && currentQ.options.length >= 2) {
                        questions.push(currentQ);
                    }
                    let qNum = line.replace(')', '');
                    currentQ = { id: `${bankId}-${qNum}`, num: qNum, text: lines[i + 1] || "", options: [], bank: bankId };
                    i++;
                    continue;
                }

                if (/^[A-D]\)$/.test(line) && currentQ) {
                    currentQ.options.push(lines[i + 1] || "");
                    i++;
                    continue;
                }

                if (currentQ) {
                    if (currentQ.options.length > 0) {
                        currentQ.options[currentQ.options.length - 1] += " " + line;
                    } else {
                        currentQ.text += " " + line;
                    }
                }
            }

            if (currentQ && currentQ.text && currentQ.options.length >= 2) {
                questions.push(currentQ);
            }

            questions.forEach(q => {
                const ansLetter = answerMap[q.num];
                if (ansLetter) {
                    q.ansIndex = ansLetter.charCodeAt(0) - 65;
                }
            });

            return questions.filter(q => q.ansIndex !== undefined);
        }

        const ALL_QUESTIONS = [
            ...parseBank(raw15, '1-5'),
            ...parseBank(raw16, '1-6'),
            ...parseBank(raw162, '1-6.2')
        ];

        function startQuiz() {
            let pool = [...ALL_QUESTIONS];

            // 篩選題庫
            if (state.settings.bank !== 'all') {
                pool = pool.filter(q => q.bank === state.settings.bank);
            }
            
            // 篩選錯題/標籤
            if (state.settings.filter === 'wrong') {
                pool = pool.filter(q => state.history.wrong.includes(q.id));
            } else if (state.settings.filter === 'bookmarks') {
                pool = pool.filter(q => state.history.bookmarks.includes(q.id));
            }

            if (pool.length === 0) {
                alert("此條件下沒有題目可供測驗！\n(可能是你選擇了「僅錯題」，但目前還沒有答錯的題目。)");
                return;
            }

            // 打亂題目
            pool = pool.sort(() => Math.random() - 0.5);

            // 截斷題數
            if (state.settings.count !== 'all') {
                pool = pool.slice(0, parseInt(state.settings.count));
            }

            // 處理選項隨機
            state.quizQuestions = pool.map(q => {
                let opts = q.options.map((text, idx) => ({ text, originalIndex: idx }));
                if (state.settings.randomize) {
                    opts = opts.sort(() => Math.random() - 0.5);
                }
                return { ...q, displayOptions: opts };
            });

            state.currentIndex = 0;
            state.userAnswers = {};
            state.isAnswered = false;
            state.view = 'quiz';
            render();
        }

        function selectOption(originalIndex) {
            if (state.isAnswered) return;
            
            const currentQ = state.quizQuestions[state.currentIndex];
            const isCorrect = originalIndex === currentQ.ansIndex;

            state.userAnswers[state.currentIndex] = originalIndex;
            state.isAnswered = true;

            // 🌟 更新「總共刷了幾題」的紀錄
            state.history.totalAnswered += 1;

            // 更新錯題本
            const wrongSet = new Set(state.history.wrong);
            if (!isCorrect) {
                wrongSet.add(currentQ.id);
            } else {
                wrongSet.delete(currentQ.id); // 答對即移出錯題本
            }
            state.history.wrong = Array.from(wrongSet);
            
            saveHistory();
            render();
        }

        function goNext() {
            if (state.currentIndex < state.quizQuestions.length - 1) {
                state.currentIndex++;
                state.isAnswered = false;
            } else {
                state.view = 'summary';
            }
            render();
        }

        function goHome() {
            if(state.view === 'quiz' && !confirm('確定要放棄目前進度回首頁嗎？')) return;
            state.view = 'home';
            render();

                let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all flex items-start gap-3 ";
                let iconHtml = "";
                
                if (!state.isAnswered) {
                    btnClass += "border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 cursor-pointer";
                } else {
                    if (isCorrectAns) {
                        btnClass += "border-emerald-500 bg-emerald-50 text-emerald-900";
                        iconHtml = icons.check("text-emerald-500 flex-shrink-0");
                    } else if (isSelected) {
                        btnClass += "border-rose-500 bg-rose-50 text-rose-900";
                        iconHtml = icons.x("text-rose-500 flex-shrink-0");
                    } else {
                        btnClass += "border-slate-100 bg-slate-50 text-slate-400 opacity-60 cursor-default";
                    }
                }

                return `
                    <button onclick="selectOption(${opt.originalIndex})" class="${btnClass}">
                        <span class="font-bold w-6 flex-shrink-0 mt-0.5">${String.fromCharCode(65 + i)})</span>
                        <span class="flex-1">${opt.text}</span>
                        ${state.isAnswered ? iconHtml : ''}
                    </button>
                `;
            }).join('');

            return `
                <div class="max-w-3xl mx-auto w-full flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <button onclick="goHome()" class="text-slate-500 hover:text-slate-800 font-medium transition-colors">← 回首頁</button>
                        
                        <div class="text-xs md:text-sm font-bold bg-indigo-100 text-indigo-800 px-3 py-1.5 rounded-full shadow-sm">
                            📁 題庫 ${currentQ.bank} - 第 ${currentQ.num} 題
                        </div>
                    </div>

                    <!-- 進度條 -->
                    <div class="mb-6">
                        <div class="flex justify-between text-sm text-slate-500 font-medium mb-2 px-1">
                            <span>目前進度： ${currQNum} / ${totalQ} 題</span>
                            <span>${Math.round(progressPct)}%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden shadow-inner">
                            <div class="bg-indigo-600 h-3 rounded-full transition-all duration-500 ease-out" style="width: ${progressPct}%"></div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 flex-1 flex flex-col">
                        <div class="flex justify-between items-start gap-4 mb-6">
                            <h2 class="text-lg md:text-xl font-medium leading-relaxed">
                                <span class="font-bold text-indigo-600 mr-2">${state.currentIndex + 1}.</span>
                                ${currentQ.text}
                            </h2>
                            <button onclick="toggleBookmark('${currentQ.id}')" class="p-2 hover:bg-slate-100 rounded-full transition-colors flex-shrink-0" title="標記此題">
                                ${icons.star(isBookmarked, "text-slate-400")}
                            </button>
                        </div>

                        <div class="space-y-3 flex-1">
                            ${optionsHtml}
                        </div>

                        <div class="mt-8 pt-6 border-t border-slate-100 flex justify-end min-h-[80px] items-center">
                            ${state.isAnswered 
                                ? `<button onclick="goNext()" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-colors shadow-md flex items-center gap-2">
                                    ${state.currentIndex < state.quizQuestions.length - 1 ? '下一題' : '看測驗結果'} →
                                   </button>`
                                : `<div class="text-slate-400 text-sm">請選擇一個答案</div>`
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSummary() {
            let correctCount = 0;
            state.quizQuestions.forEach((q, idx) => {
                if (state.userAnswers[idx] === q.ansIndex) correctCount++;
            });
            const score = Math.round((correctCount / state.quizQuestions.length) * 100);

            const detailsHtml = state.quizQuestions.map((q, idx) => {
                const isCorrect = state.userAnswers[idx] === q.ansIndex;
                const isBookmarked = state.history.bookmarks.includes(q.id);
                return `
                    <div class="p-4 hover:bg-slate-50 flex items-start gap-4 transition-colors">
                        <div class="mt-1 flex-shrink-0">
                            ${isCorrect ? icons.check("text-emerald-500") : icons.x("text-rose-500")}
                        </div>
                        <div class="flex-1 space-y-1">
                            <div class="font-medium text-slate-800">${q.text}</div>
                            
                            <div class="text-xs text-slate-400 mb-2">
                                來源：題庫 ${q.bank} - 第 ${q.num} 題
                            </div>

                            <div class="text-sm text-slate-500 flex items-center gap-2">
                                正確解答：<span class="font-bold text-emerald-600">${q.options[q.ansIndex]}</span>
                            </div>
                            ${(!isCorrect && state.userAnswers[idx] !== undefined) ? `
                                <div class="text-sm text-slate-500 flex items-center gap-2">
                                    你的作答：<span class="text-rose-500 line-through">${q.options[state.userAnswers[idx]]}</span>
                                </div>
                            ` : ''}
                        </div>
                        <button onclick="toggleBookmark('${q.id}')" class="p-2 hover:bg-slate-200 rounded-full transition-colors flex-shrink-0">
                            ${icons.star(isBookmarked, "text-slate-400 w-5 h-5")}
                        </button>
                    </div>
                `;
            }).join('');

            return `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center space-y-4">
                        <h2 class="text-2xl font-bold text-slate-800">測驗完成！</h2>
                        <div class="text-6xl font-black text-indigo-600 py-4">${score} <span class="text-2xl text-slate-400">分</span></div>
                        <p class="text-slate-600">共 ${state.quizQuestions.length} 題，答對 ${correctCount} 題</p>
                        
                        <div class="pt-6">
                            <button onclick="goHome()" class="px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-colors shadow-md">
                                回首頁繼續刷題
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 bg-slate-100 border-b border-slate-200 font-bold text-slate-700">作答明細</div>
                        <div class="divide-y divide-slate-100">
                            ${detailsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            if (state.view === 'home') appDiv.innerHTML = renderHome();
            else if (state.view === 'quiz') appDiv.innerHTML = renderQuiz();
            else if (state.view === 'summary') appDiv.innerHTML = renderSummary();
        }

        // 初始化
        render();

    </script>
</body>
</html>
